[package]
name = "hero-of-arcadia"
version = "1.0.0"
description = "Hero of Arcadia - a retro pixel-art turn-based tactics game"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
